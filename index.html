<!DOCTYPE html>
<html>
<head>
<title>Weltraum Quiz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&amp;display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">  
<link rel="stylesheet" href="styles.css">
		<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- we import arjs version without NFT but with marker + location based support -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
	<script>
		let openModal;

		AFRAME.registerComponent('cursor-listener', { 
			init: function () {
				this.el.addEventListener('click', e => {
					openModal(this.el.dataset.cardId);
				});
			}
		});

	</script>
</head>
<body>


        <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;' renderer="precision: mediump">
	  <a-assets timeout="50000">
		  <a-mixin id="planetoid" geometry="primitive: sphere; radius: 2; segmentsWidth: 24; segmentsHeight: 24" shadow="receive: false"></a-mixin>
        <img crossorigin="anonymous" id="sunmap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960594/space-game/sun_wrfsw4.png">
        <img crossorigin="anonymous" id="mercurymap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960591/space-game/mercury_c2lwya.png">
        <img crossorigin="anonymous" id="venusmap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960592/space-game/venus_obiwya.png">
        <img crossorigin="anonymous" id="earthmap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960589/space-game/earthwClouds_z67eyv.png">
        <img crossorigin="anonymous" id="marsmap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960590/space-game/mars_nt7grv.png">
        <img crossorigin="anonymous" id="jupitermap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960590/space-game/jupiter_j65pos.png">
        <img crossorigin="anonymous" id="saturnmap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960574/space-game/saturn_be7cr2.png">
        <img crossorigin="anonymous" id="uranusmap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678959852/space-game/uranus_iysk5n.png">
        <img crossorigin="anonymous" id="neptunemap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678959859/space-game/neptune_iv0sbs.png">
        <img crossorigin="anonymous" id="plutomap" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960566/space-game/pluto_zn6xef.png">
        <img crossorigin="anonymous" id="saturnRings" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960572/space-game/saturnRings_sg6hku.png">
		  <img crossorigin="anonymous" id="uranusRings" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678960579/space-game/uranusRings_mpxgeu.png">
      <img crossorigin="anonymous" id="arrow" src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1679001625/space-game/arrow_yzt0k1.png">
     </a-assets>

<!-- Sun -->
<a-marker type="barcode" value="1" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-90 0 0">
    <a-entity
      id="sun"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #sunmap"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
      data-card-id="Sonne"
    ></a-entity>
  </a-entity>
</a-marker>

<!-- Mercury -->
<a-marker type="barcode" value="2" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-90 0 0">
    <a-entity
      id="mercury"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #mercurymap"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
      data-card-id="Merkur"
    ></a-entity>
  </a-entity>
</a-marker>

<!-- Venus -->
<a-marker type="barcode" value="3" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-90 0 0">
    <a-entity
      id="venus"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #venusmap"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
      data-card-id="Venus"
    ></a-entity>
  </a-entity>
</a-marker>

<!-- Earth -->
<a-marker type="barcode" value="4" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-90 0 0">
    <a-entity
      id="earth"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #earthmap"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
      data-card-id="Erde"
    ></a-entity>
  </a-entity>
</a-marker>

<!-- Mars -->
<a-marker type="barcode" value="5" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-90 0 0">
    <a-entity
      id="mars"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #marsmap"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
      data-card-id="Mars"
    ></a-entity>
  </a-entity>
</a-marker>

<!-- Jupiter -->
<a-marker type="barcode" value="6" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-90 0 0">
    <a-entity
      id="jupiter"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #jupitermap"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
      data-card-id="Jupiter"
    ></a-entity>
  </a-entity>
</a-marker>

<!-- Saturn -->
<a-marker type="barcode" value="7" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-90 0 0">
    <a-entity
      id="saturn"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #saturnmap"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
      data-card-id="Saturn"
    >
      <a-circle
        src="#saturnRings"
        radius="50"
        rotation="-90 0 0"
        scale=".1 .1 .1"
        material="transparent: true"
      ></a-circle>
    </a-entity>
  </a-entity>
</a-marker>

<!-- Uranus -->
<a-marker type="barcode" value="8" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-25.3 -85.8 81.8">
    <a-entity
      id="uranus"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #uranusmap"
      data-card-id="Uranus"
    >
      <a-circle
        src="#uranusRings"
        radius="40"
        scale=".1 .1 .1"
        material="transparent: true"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 30000; easing: linear"
      ></a-circle>
    </a-entity>
  </a-entity>
</a-marker>

<!-- Neptune -->
<a-marker type="barcode" value="9" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-90 0 0">
    <a-entity
      id="neptune"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #neptunemap"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
      data-card-id="Neptun"
    ></a-entity>
  </a-entity>
</a-marker>

<!-- Pluto -->
<a-marker type="barcode" value="10" smooth="true" smoothCount="50" smoothTolerance="0.04" smoothThreshold="80">
  <a-entity rotation="-90 0 0">
    <a-entity
      id="pluto"
      mixin="planetoid"
      scale="1 1 1"
      material="src: #plutomap"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
      data-card-id="Pluto"
    ></a-entity>
  </a-entity>
</a-marker>

          
        <a-entity camera>
          <a-entity cursor="fuse: false; fuseTimeout: 500"
                    position="0 0 -1"
					raycaster="objects: [cursor-listener]"
                    geometry="primitive: ring; radiusInner: 0.019; radiusOuter: 0.02"
                    material="color: #0faffa; shader: flat">
          </a-entity>
        </a-entity>
        </a-scene>
<div class="page is-active">
  <div class="camera">
  </div>
  <div class="space">
    <div class="screen screen--stars"></div>
    <div class="arrows">
      <i class="bi bi-chevron-up"></i>
      <i class="bi bi-chevron-up"></i>
      <i class="bi bi-chevron-up"></i>
    </div>
    <button type="button" class="btn btn-secondary start">Start</button>
  </div>
  <div class="screen screen--directions">
    <div class="text">
      <button type="button" class="btn-close" aria-label="Close"></button>
      <h6>How to play</h6>
        <p>
          This is a simulation of a real life children's treasure hunt
        </p>
        <ul>
          <li>Scroll down the page</li>
          <li>Point your phone's camara at the ar markers</li>
          <li>Click on each planet to open the quiz and see the next clue</li>
        </ul>
        <p>
          Your journey starts art the corner of Main and East Street
        </p>
    </div>
  </div>
  <div class="screen screen--fireworks">
    <img src="https://res.cloudinary.com/dq6yyajp4/image/upload/v1678889692/space-game/fireworks_xcsjbj.gif" />
    <button type="button" class="btn btn-secondary btn-reset">Reset</button>
  </div>
  
  <div class="screen screen--game">
    <div class="hud">
        <div class="points">
          <span clasS="points-text">
            <i class="bi bi-chevron-double-right"></i>
            Points <span class="points-counter"></span>
            <i class="bi bi-chevron-double-left"></i>
            
          </span>
        </div>
      <svg version="1.1" viewBox="0 0 1000 500" preserveAspectRatio="none" >

			V21.547L20.95,2.988L262.557,1.011 M736.999-2l-42.666,27H306.999L263.666-2l-244,2L0,20.333V240.5l10,9.5L0,260.5V479l19.666,21

      </svg>
    </div>
    <!-- Button trigger modal -->

  </div>
  
</div>

<!-- Modal -->
<div class="modal fade" id="planetModal" tabindex="-1" aria-labelledby="planetModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="planetModalLabel">Modal title</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"><i class="bi-x-lg"></i></button>
      </div>
      <div class="modal-body questions">
      </div>
      <div class="modal-body success-message">

      </div>
      <div class="modal-footer">

      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/js/bootstrap.min.js"></script>
